workflows:
  compile-check:
    name: Compile Check (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile
        script: |
          xcodebuild \
            -project "BakeRatio.xcodeproj" \
            -scheme "BakeRatio" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app

  ios-build:
    name: Bake Ratio iOS Build (App Store)
    max_build_duration: 60
    integrations:
      app_store_connect: bakeratio
    environment:
      xcode: latest
      # 点名使用 Codemagic 里已上传的证书 + 描述文件（不走自动匹配，
      # 自动匹配会报 No matching profiles found）
      ios_signing:
        certificates:
          - bakeratio_dist2
        provisioning_profiles:
          - bakeratio_profile2
    scripts:
      - name: Apply profiles to the project
        script: |
          set -euo pipefail
          # 写工程签名设置并生成 export_options.plist；缺这一步 build-ipa 会报文件不存在
          xcode-project use-profiles
      - name: Show signing files in use
        script: |
          set -euo pipefail
          security find-identity -v -p codesigning || true
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null | wc -l
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "BakeRatio.xcodeproj" \
            --scheme "BakeRatio"
    publishing:
      app_store_connect:
        auth: integration
        # 只上传构建；外部测试 Beta 审核需要先填 Test Information，会让整个构建变红
        submit_to_testflight: false
    artifacts:
      - build/ios/ipa/*.ipa

  ios-build-adhoc:
    name: Bake Ratio Ad Hoc (device install)
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        certificates:
          - bakeratio_dist2
        provisioning_profiles:
          - bakeratio_adhoc
    scripts:
      - name: Apply profiles to the project
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Set build number
        script: |
          agvtool new-version -all $BUILD_NUMBER
      - name: Build Ad Hoc ipa
        script: |
          xcode-project build-ipa \
            --project "BakeRatio.xcodeproj" \
            --scheme "BakeRatio"
      - name: Show ipa info
        script: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -1)
          echo "ipa: $IPA"
          ls -lh "$IPA"
    artifacts:
      - build/ios/ipa/*.ipa

  demo-capture:
    name: Demo Screenshots (no signing)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build for simulator
        script: |
          xcodebuild \
            -project "BakeRatio.xcodeproj" \
            -scheme "BakeRatio" \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Capture
        script: |
          set -e
          BUNDLE="com.ywrvxkw66k.bakeratio"
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          mkdir -p capture
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 17 Pro Max (" | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 4
          xcrun simctl io "$UDID" screenshot "capture/01-calculator.png"
          sips -g pixelWidth -g pixelHeight capture/01-calculator.png || true
          ls -la capture
    artifacts:
      - capture/*.png
