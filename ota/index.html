<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bake Ratio 安装</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
         max-width: 480px; margin: 0 auto; padding: 40px 22px; line-height: 1.7;
         color: #3a2b1c; background: #fdfaf4; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 26px 22px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 1.35em; margin: 0 0 6px; }
  .sub { color: #9a7a52; font-size: .92em; margin-top: 0; }
  .btn { display: block; margin: 26px auto 10px; padding: 16px 24px; border-radius: 12px;
         background: #9e611a; color: #fff; text-decoration: none; font-weight: 600; font-size: 1.05em; }
  .btn:active { opacity: .82; }
  .note { font-size: .85em; color: #6a5a48; text-align: left; margin-top: 22px; }
  .note li { margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Bake Ratio</h1>
    <p class="sub">内部测试版 · 1.0 (BUILD_VERSION)</p>

    <a class="btn" href="itms-services://?action=download-manifest&url=https://dnizii.top/bakeratio/manifest.plist">
      安装到这台 iPhone
    </a>

    <p class="sub">请务必用 <strong>Safari</strong> 打开本页</p>

    <div class="note">
      <strong>安装后如果提示“未受信任的开发者”：</strong>
      <ol>
        <li>设置 → 通用 → VPN与设备管理</li>
        <li>点开发者名称 → 信任</li>
        <li>回到桌面打开 Bake Ratio</li>
      </ol>
      <p>如果点按钮没反应：确认是用 Safari（不是微信内置浏览器），或把本页链接复制到 Safari 打开。</p>
    </div>
  </div>
</body>
</html>
